<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-app" aria-label="待辦清單應用程式">
        <header class="app-header">
          <h1>待辦清單</h1>
        </header>

        <form id="todoForm" class="todo-form" autocomplete="off">
          <label class="sr-only" for="todoInput">新增待辦事項</label>
          <input
            id="todoInput"
            type="text"
            placeholder="新增待辦事項..."
            maxlength="120"
          />
          <button type="submit" class="add-btn">新增</button>
        </form>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>

        <p id="emptyState" class="empty-state" aria-live="polite">
          還沒有任何待辦事項,新增一個吧!
        </p>

        <footer class="app-footer">
          <span id="todoCount">未完成: 0 項</span>
        </footer>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
